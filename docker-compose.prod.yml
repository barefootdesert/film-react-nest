# Запуск на сервере из готовых образов GHCR (без локальной сборки)
services:
  database:
    image: postgres:16
    container_name: film-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./backend/test/prac.init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/test/prac.films.sql:/docker-entrypoint-initdb.d/02-films.sql:ro
      - ./backend/test/prac.shedules.sql:/docker-entrypoint-initdb.d/03-schedules.sql:ro
    networks:
      - film-network
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - film-network
    depends_on:
      - database
    restart: always

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    container_name: film-backend
    environment:
      DATABASE_DRIVER: ${DATABASE_DRIVER}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PORT: ${PORT}
      LOGGER_TYPE: ${LOGGER_TYPE}
    networks:
      - film-network
    depends_on:
      - database
    restart: always

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:latest
    container_name: film-frontend
    volumes:
      - frontend-dist:/usr/share/nginx/html
    networks:
      - film-network
    restart: always

  nginx:
    image: ghcr.io/${GITHUB_REPOSITORY}/nginx:latest
    container_name: film-nginx
    ports:
      - "80:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    networks:
      - film-network
    depends_on:
      - backend
      - frontend
    restart: always

networks:
  film-network:
    driver: bridge

volumes:
  pg-data:
  pgadmin-data:
  frontend-dist:
